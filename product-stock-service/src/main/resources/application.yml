server:
  port: 8081

spring:
  application:
    name: product-stock-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml

  # 数据库配置（等安装 MySQL 后再改成真实的）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/seckill_stock?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root   # 改成你自己的 MySQL 密码

  # Redis 配置（等安装 Redis 后再启动）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:        # 如果有密码就填，没有就空着
      database: 0

# MyBatis-Plus 简单配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto