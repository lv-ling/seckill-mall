server:
  port: 8082

spring:
  application:
    name: seckill-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: seckill-producer-group